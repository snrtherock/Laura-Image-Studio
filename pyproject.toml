[project]
name = "laura-image-studio"
description = "Beginner-friendly ComfyUI node pack for AI influencer image, video, and audio workflows"
version = "2.0.0"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "packaging>=23.0",
    "psutil>=5.9.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "huggingface_hub>=0.20.0",
    "colorama>=0.4.6",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
video = [
    "av>=12.0.0",
    "ffmpeg-python>=0.2.0",
    "imageio>=2.33.0",
    "imageio-ffmpeg>=0.4.9",
]
face = [
    "insightface>=0.7.3",
    "filterpy>=1.4.5",
    "scipy>=1.11.0",
    "onnxruntime-gpu>=1.17.0; platform_machine == 'x86_64' and sys_platform != 'darwin'",
    "onnxruntime>=1.17.0; platform_machine != 'x86_64' or sys_platform == 'darwin'",
]
upscale = [
    "spandrel>=0.3.0",
    "kornia>=0.7.1",
    "open-clip-torch>=2.24.0",
]
advanced = [
    "accelerate>=0.28.0",
    "transformers>=4.38.0",
    "safetensors>=0.4.0",
    "diffusers>=0.26.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
]
all = [
    "laura-image-studio[video,face,upscale,advanced]",
]

[project.urls]
Repository = "https://github.com/snrtherock/Laura-Image-Studio"

[tool.comfy]
PublisherId = "snrtherock"
DisplayName = "Laura Image Studio"
Icon = ""
